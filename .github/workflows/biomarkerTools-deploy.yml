name: Deploy BiomarkerTools
on:
  workflow_dispatch:
    inputs:
      tier:
        description: "Deploy environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - qa
          - stage
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  deploy-fargate:
    runs-on: ubuntu-latest
    environment: ${{ inputs.tier }}
    env:
      APP: biomarkertools
      TZ: America/New_York
      AWS_REGION: us-east-1
      TASK_DEFINITION_TEMPLATE_PATH: .github/aws
      BACKEND_CONTAINER_PORT: 8160
      TIER: ${{ inputs.tier }}
      IMAGE_TIER: ${{ contains(fromJson('["dev","qa"]'), inputs.tier) && 'development' || 'release' }}
      CICD_ROLE_ARN: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/power-user-github-actions-cicd

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5.1.1
        with:
          role-to-assume: ${{ env.CICD_ROLE_ARN }}
          role-session-name: ${{ env.TIER }}-${{ env.APP }}-deploy-${{ github.ref_name }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set dynamic environment variables
        run: |
          TIMESTAMP=$(date +"%Y%m%d%H%M%S")
          REPO=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com/$APP
          
          echo "IMAGE_REPOSITORY=$REPO" >> $GITHUB_ENV
          echo "BACKEND_IMAGE=$REPO:$IMAGE_TIER-backend-${{ github.ref_name }}-$TIMESTAMP" >> $GITHUB_ENV
          echo "BACKEND_IMAGE_LATEST=$REPO:$IMAGE_TIER-backend-${{ github.ref_name }}-latest" >> $GITHUB_ENV
          echo "PARAMETER_PATH=/analysistools/${TIER}/$APP" >> $GITHUB_ENV
          echo "ENVIRONMENT_TIER=${TIER^^}" >> $GITHUB_ENV

      - name: Retrieve SSM parameters
        run: |
          PARAMETER_PATH="/analysistools/${TIER}/$APP"
          
          declare -A PARAMS=(
            ["ecs_cluster"]="ECS_CLUSTER"
            ["ecs_web_task"]="ECS_WEB_TASK"
            ["ecs_web_service"]="ECS_WEB_SERVICE"
            ["ecs_cpu_units"]="ECS_CPU_UNITS"
            ["ecs_memory_units"]="ECS_MEMORY_UNITS"
            ["role_arn"]="ROLE_ARN"
            ["efs_filesystem_id"]="EFS_FILESYSTEM_ID"
            ["efs_access_point_id"]="EFS_ACCESS_POINT_ID"
          )
          
          MISSING_PARAMS=()
          
          for ssm_name in "${!PARAMS[@]}"; do
            env_var="${PARAMS[$ssm_name]}"
            value=$(aws ssm get-parameter \
              --name "${PARAMETER_PATH}/${ssm_name}" \
              --with-decryption \
              --query "Parameter.Value" \
              --output text 2>/dev/null || echo "")
            
            if [ -z "$value" ]; then
              MISSING_PARAMS+=("${PARAMETER_PATH}/${ssm_name}")
              echo "❌ Missing: ${ssm_name}"
            else
              echo "${env_var}=${value}" >> $GITHUB_ENV
              echo "✓ Retrieved ${ssm_name} -> ${env_var}"
            fi
          done
          
          if [ ${#MISSING_PARAMS[@]} -gt 0 ]; then
            echo ""
            echo "❌ ERROR: Missing required SSM parameters:"
            for param in "${MISSING_PARAMS[@]}"; do
              echo "  - $param"
            done
            exit 1
          fi

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2.0.1
        with:
          mask-password: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.12.0

      - name: Build and push backend image
        uses: docker/build-push-action@v6.18.0
        with:
          context: biomarkerTools
          file: biomarkerTools/docker/backend.dockerfile
          pull: true
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}
            ${{ env.BACKEND_IMAGE_LATEST }}
          cache-from: type=registry,ref=${{ env.BACKEND_IMAGE_LATEST }}
          cache-to: type=inline

      - name: Render web task definition
        run: |
          envsubst < $TASK_DEFINITION_TEMPLATE_PATH/web.yml > web.yml
          echo "Rendered Web Task Definition:"
          cat web.yml

      - name: Register web task definition
        run: |
          aws ecs register-task-definition --cli-input-yaml file://web.yml

      - name: Update ECS web service
        run: |
          echo "Checking deployment prerequisites..."
          MISSING_RESOURCES=()
          
          # Check if ECS service exists
          SERVICE_STATUS=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_WEB_SERVICE }} \
            --query 'services[0].status' \
            --output text 2>/dev/null || echo "MISSING")
          
          if [ "$SERVICE_STATUS" != "ACTIVE" ]; then
            MISSING_RESOURCES+=("ECS Service: ${{ env.ECS_WEB_SERVICE }} (in cluster ${{ env.ECS_CLUSTER }})")
          fi
          
          # Check for network configuration parameters (needed for service creation)
          PARAMETER_PATH="/analysistools/${{ env.TIER }}/${{ env.APP }}"
          
          SUBNET_IDS=$(aws ssm get-parameter \
            --name "${PARAMETER_PATH}/subnet_ids" \
            --query "Parameter.Value" \
            --output text 2>/dev/null || echo "")
          
          SECURITY_GROUP_IDS=$(aws ssm get-parameter \
            --name "${PARAMETER_PATH}/security_group_ids" \
            --query "Parameter.Value" \
            --output text 2>/dev/null || echo "")
          
          if [ -z "$SUBNET_IDS" ]; then
            MISSING_RESOURCES+=("SSM Parameter: ${PARAMETER_PATH}/subnet_ids")
          fi
          
          if [ -z "$SECURITY_GROUP_IDS" ]; then
            MISSING_RESOURCES+=("SSM Parameter: ${PARAMETER_PATH}/security_group_ids")
          fi
          
          # Report all missing resources
          if [ ${#MISSING_RESOURCES[@]} -gt 0 ]; then
            echo ""
            echo "❌ ERROR: Cannot proceed with deployment. Missing resources:"
            for resource in "${MISSING_RESOURCES[@]}"; do
              echo "  - $resource"
            done
            echo ""
            echo "To resolve this:"
            if [ "$SERVICE_STATUS" != "ACTIVE" ]; then
              echo "  1. Create the ECS service '${{ env.ECS_WEB_SERVICE }}' manually, OR"
              echo "  2. Add the missing SSM parameters for automatic service creation"
            else
              echo "  - Add the missing SSM parameters listed above"
            fi
            exit 1
          fi
          
          echo "✓ All prerequisites met"
          echo "Updating ECS service..."
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_WEB_SERVICE }} \
            --task-definition ${{ env.ECS_WEB_TASK }} \
            --desired-count 1 \
            --propagate-tags TASK_DEFINITION \
            --force-new-deployment

      - name: Remove old task definitions
        run: |
          echo "Pruning old revisions for family: $ECS_WEB_TASK"
          aws ecs list-task-definitions --family-prefix "$ECS_WEB_TASK" --sort DESC --query 'taskDefinitionArns[10:]' --output text \
            | xargs -n1 -r aws ecs deregister-task-definition --task-definition
